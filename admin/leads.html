<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Leads — Lumina CMS</title><link rel="stylesheet" href="../css/admin.css"></head><body><aside class="sidebar"><a class="brand" href="../index.html"><span class="brand-mark">L</span>Lumina.</a><nav><a href="index.html">Dashboard</a><a href="services.html">Services</a><a href="pages.html">Pages</a><a href="blog.html">Blog</a><a class="active" href="leads.html">Leads</a><a href="settings.html">Settings</a></nav></aside><main class="admin-main"><header class="admin-top"><div><p class="eyebrow">INBOX</p><h1>Leads & bookings</h1></div></header><section class="panel"><div id="empty">No submissions yet.</div><div id="leadList"></div></section></main><script src="../js/admin.js"></script><script>const leads=JSON.parse(localStorage.getItem('lumina_leads')||'[]'),bookings=JSON.parse(localStorage.getItem('lumina_bookings')||'[]');document.querySelector('#empty').style.display=leads.length||bookings.length?'none':'block';document.querySelector('#leadList').innerHTML=[...leads.map(x=>`<div class="table-row"><div><b>${x.name}</b><small>${x.email}</small></div><span>Lead</span><span>${x.date}</span></div>`),...bookings.map(x=>`<div class="table-row"><div><b>${x.name}</b><small>${x.email} · ${x.service}</small></div><span>Booking</span><span>${x.date}</span></div>`)].join('');</script></body></html>
